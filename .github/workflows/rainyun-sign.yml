name: Rainyun 自动签到

on:
  schedule:
    # 注意：cron 用 UTC。'10 7 * * *' = 北京时间 16:10（原注释写 12 点，与表达式不符）
    - cron: '10 8 * * *'
  workflow_dispatch:

jobs:
  sign-in:
    # ★ 核心修复：ubuntu-latest 已滚动到 Ubuntu 26.04，
    # 而 actions/python-versions 只为 3.9 构建到 24.04（最新 3.9.25），
    # 26.04 只有 3.10+ 才有包 → 必须钉死 24.04 才能继续用 3.9
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 缓存Python依赖
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable curl unzip

      - name: 确保temp目录存在
        run: mkdir -p temp

      - name: 执行签到脚本
        # 原写法 `DEBUG=true HEADLESS=false python rainyun.py python rainyun.py` 有两个问题：
        #   1) 末尾多了一段 "python rainyun.py"，会被当成脚本参数传进 sys.argv
        #   2) HEADLESS=false 覆盖了下面 env 里的 true（虽然脚本在 Actions 下会强制 headless，
        #      但没必要留这个矛盾）
        # runs-on 上没有显示器，有头模式必然起不来，所以这里统一交给 env 控制。
        run: python rainyun.py
        env:
          RAINYUN_USER: ${{ secrets.RAINYUN_USER }}
          RAINYUN_PASS: ${{ secrets.RAINYUN_PASS }}

          PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
          PUSH_PLUS_USER: ${{ secrets.PUSH_PLUS_USER }}

          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_NAME: ${{ secrets.SMTP_NAME }}

          BARK_PUSH: ${{ secrets.BARK_PUSH }}

          DD_BOT_SECRET: ${{ secrets.DD_BOT_SECRET }}
          DD_BOT_TOKEN: ${{ secrets.DD_BOT_TOKEN }}

          FSKEY: ${{ secrets.FSKEY }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}

          PUSH_KEY: ${{ secrets.PUSH_KEY }}

          HEADLESS: "true"
          DEBUG: "false"

      - name: 清理临时文件
        run: rm -rf temp
        if: always()
