name: 仓库保活任务

# 作用：公开仓库连续 60 天没有任何提交活动时，GitHub 会自动停用所有 schedule 定时任务。
# 本 workflow 定期往 .github/keepalive.txt 写时间戳并提交，制造"仓库活动"，防止签到定时任务被停用。

on:
  schedule:
    # cron 的"日"字段写 */14 表示每月 1、15、29 号，不是严格的"每 14 天"。
    # 对保活来说足够：最大间隔 14 天，远小于 60 天阈值。
    - cron: '0 0 */14 * *'
  workflow_dispatch:

permissions:
  contents: write   # 必需。缺了这行 git push 会 403

jobs:
  keepalive:
    # 保活只跑 git，不依赖 Python，钉版本只为跟签到 job 保持一致、避免 latest 漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 写保活时间戳
        run: |
          mkdir -p .github
          echo "Last keep-alive: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/keepalive.txt

      - name: 提交并推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: keepalive [skip ci]"
            git push
            echo "保活提交完成"
          fi
